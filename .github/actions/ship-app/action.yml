name: 'Ship app with ctl'
description: 'Uses cloud template library to deploy apps to AWS'
inputs:
  app-name:
    required: true
    description: 'App to ship'
  environment-name:
    required: true
    description: 'Environment to ship to'
  role-arn:
    required: true
    description: 'ARN for deployment role'

runs:
  using: 'composite'
  steps:
    - uses: pnpm/setup@v2

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install city CLI
      shell: bash
      run: npm install -g @phila/cli

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: us-east-1

    - name: Build workspace dependencies
      shell: bash
      run: pnpm turbo build --filter=@pinboard/${{ inputs.app-name }}^...

    - name: Ship to ${{ inputs.environment-name }}
      working-directory: ${{ format('apps/{0}', inputs.app-name) }}
      shell: bash
      run: city ship ${{ inputs.environment-name }} --web

    - name: Serve the iOS association file as JSON
      if: inputs.app-name == 'philly-311'
      working-directory: apps/philly-311
      shell: bash
      env:
        DEPLOY_ENVIRONMENT: ${{ inputs.environment-name }}
      run: |
        # The extensionless association file has no MIME type for the S3 sync to infer.
        association_file=.well-known/apple-app-site-association
        bucket="${DEPLOY_ENVIRONMENT}-philly-311-s3-static-site"
        aws s3 cp "frontend/dist/$association_file" "s3://$bucket/$association_file" \
          --content-type application/json --only-show-errors

        distribution_id="$(aws ssm get-parameter \
          --name "/$DEPLOY_ENVIRONMENT/philly-311/cloudfront/static-site/distribution-id" \
          --query Parameter.Value --output text)" ||
          distribution_id="$(aws ssm get-parameter \
            --name "/$DEPLOY_ENVIRONMENT/philly-311/static-site/distribution-id" \
            --query Parameter.Value --output text)"
        aws cloudfront create-invalidation --distribution-id "$distribution_id" \
          --paths "/$association_file" --no-cli-pager
