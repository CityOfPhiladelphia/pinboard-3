name: Detect changed apps
description: 'Check which apps have changes that need to be shipped'
outputs:
  oem:
    description: 'OEM Finder has changes'
    value: ${{ steps.changes.outputs.oem }}
  pcf:
    description: 'Primary Care Finder has changes'
    value: ${{ steps.changes.outputs.pcf }}
  phil311:
    description: 'Philly 311 has changes'
    value: ${{ steps.changes.outputs.phil311 }}
runs-on: ubuntu-latest

runs:
  using: 'composite'
  steps:
    - name: Check changed files
      shell: bash
      run: |
        CHANGED=$(git diff --name-only HEAD^1 HEAD)
        echo "$CHANGED"

        packages_changed() { echo "$CHANGED" | grep -q "^packages/"; }
        app_changed() { echo "$CHANGED" | grep -q "^apps/$1/"; }
        ci_changed() { echo "$CHANGED" | grep -q "^\.github/workflows/ci\.yml$"; }

        if packages_changed || app_changed "oem-flood-finder" || ci_changed; then
          echo "oem=true" >> $GITHUB_OUTPUT
        else
          echo "oem=false" >> $GITHUB_OUTPUT
        fi

        if packages_changed || app_changed "primary-care-finder" || ci_changed; then
          echo "pcf=true" >> $GITHUB_OUTPUT
        else
          echo "pcf=false" >> $GITHUB_OUTPUT
        fi

        if packages_changed || app_changed "philly-311" || ci_changed; then
          echo "phil311=true" >> $GITHUB_OUTPUT
        else
          echo "phil311=false" >> $GITHUB_OUTPUT
        fi
