name: Detect changed apps
description: 'Check which apps have changes that need to be shipped'
outputs:
  oem:
    description: 'OEM Flood Monitoring has changes'
    value: ${{ steps.detect-changes.outputs.oem }}
  pcf:
    description: 'Primary Care Finder has changes'
    value: ${{ steps.detect-changes.outputs.pcf }}
  phl311:
    description: 'Philly 311 has changes'
    value: ${{ steps.detect-changes.outputs.phl311 }}
  updated:
    description: 'Updated Apps'
    value: ${{ steps.detect-changes.outputs.updated }}

runs:
  using: 'composite'
  steps:
    - name: Check changed files
      id: detect-changes
      shell: bash
      run: |
        CHANGED=$(git diff --name-only HEAD^1 HEAD)
        echo "$CHANGED"

        UPDATED_APPS=()

        packages_changed() { echo "$CHANGED" | grep -q "^packages/"; }
        app_changed() { echo "$CHANGED" | grep -q "^apps/$1/"; }
        ci_changed() { echo "$CHANGED" | grep -q "^\.github/workflows/"; }

        if packages_changed || app_changed "oem-flood-finder" || ci_changed; then
          UPDATED_APPS+=("oem-flood-finder")
        fi

        if packages_changed || app_changed "primary-care-finder" || ci_changed; then
          UPDATED_APPS+=("primary-care-finder")
        fi

        if packages_changed || app_changed "philly-311" || ci_changed; then
          UPDATED_APPS+=("philly-311")
        fi

        echo "${UPDATED_APPS[@]}"
        UPDATED_STR=$(printf -v joined "%s," "${UPDATED_APPS[@]}");
        echo "$UPDATED_STR"
