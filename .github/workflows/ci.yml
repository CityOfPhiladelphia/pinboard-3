  detect-changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    # needs: check
    outputs:
      oem: ${{ steps.changes.outputs.oem }}
      pcf: ${{ steps.changes.outputs.pcf }}
      phl311: ${{ steps.changes.outputs.phl311 }}
      updated: ${{ steps.changes.outputs.updated }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: (Action) detect changes
        id: changes
        uses: ./.github/actions/detect-changes

  ship-apps:
    name: Ship Pinboard Apps
    runs-on: ubuntu-latest
    needs: detect-changes
    strategy:
      max-parallel: 2
      matrix:
        app: ${{ fromJSON(needs.detect-changes.outputs.updated) }}
    # if: needs.detect-changes.outputs.phl311 == 'true'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set env
        env:
          branch: ${{ (github.ref == 'refs/heads/main' && 'prod') || (github.ref == 'refs/heads/test' && 'test') || 'dev' }}
          app: ${{ matrix.app }}

      - name: Ship ${{ env.app }} to ${{ env.branch }} with ctl
        uses: ./.github/actions/ship-app
        with:
          app-name: ${{ env.app }}
          environment-name: ${{ env.branch }}
          role-arn: ${{ secrets.AWS_DEPLOY_ROLE_ARN_311 }}

