name: CI

on:
  pull_request:
  push:
    branches: [main, test, fix/sso-redirect]

jobs:
  check:
    name: Lint, type-check, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: (Action) Check code
        uses: ./.github/actions/check-code

  detect-changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push'
    outputs:
      updated: ${{ steps.changes.outputs.updated }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: (Action) detect changes
        id: changes
        uses: ./.github/actions/detect-changes
        with:
          branch: ${{ (github.ref == 'refs/heads/main' && 'prod') || (github.ref == 'refs/heads/test' && 'test') || 'dev' }}

  ship-apps:
    name: Ship updated Pinboard apps
    runs-on: ubuntu-latest
    needs: detect-changes
    env:
      branch: ${{ (github.ref == 'refs/heads/main' && 'prod') || (github.ref == 'refs/heads/test' && 'test') || 'dev' }}
    strategy:
      matrix:
        app: ${{ fromJSON(needs.detect-changes.outputs.updated) }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: (Action) Ship to ${{ env.branch }} with ctl
        uses: ./.github/actions/ship-app
        with:
          app-name: ${{ matrix.app.name }}
          environment-name: ${{ env.branch }}
          role-arn: ${{ case(
            matrix.app.role == 'AWS_ROLE_ARN_TEST_OEM', secrets.AWS_ROLE_ARN_TEST_OEM,
            matrix.app.role == 'AWS_ROLE_ARN_PROD_OEM', secrets.AWS_ROLE_ARN_PROD_OEM,
            matrix.app.role == 'AWS_ROLE_ARN_TEST_PCF', secrets.AWS_ROLE_ARN_TEST_PCF,
            matrix.app.role == 'AWS_ROLE_ARN_PROD_PCF', secrets.AWS_ROLE_ARN_PROD_PCF,
            matrix.app.role == 'AWS_ROLE_ARN_311', secrets.AWS_ROLE_ARN_311,
            ''
            ) }}
        env:
          VITE_311_SSO_CLIENT_ID: ${{ matrix.app.name == 'philly-311' && secrets.SSO_311_CLIENT_ID }}
          VITE_311_AIS_BASE_URL: ${{ matrix.app.name == 'philly-311' && secrets.AIS_URL }}
          VITE_311_API_BASE_URL: ${{ matrix.app.name == 'philly-311' && '/api' }}
          VITE_311_API_PROXY: |-
            ${{ case(
              matrix.app.name == 'philly-311' && env.branch == 'prod', '/prod',
              matrix.app.name == 'philly-311' && env.branch == 'test', '/test',
              matrix.app.name == 'philly-311', '/dev',
              ''
            ) }}
          VITE_311_SSO_TENANT: |-
            ${{ case(
              matrix.app.name == 'philly-311' && env.branch == 'prod', secrets.SSO_311_TENANT_PROD,
              matrix.app.name == 'philly-311' && env.branch == 'test', secrets.SSO_311_TENANT_TEST,
              matrix.app.name == 'philly-311', secrets.SSO_311_TENANT_DEV,
              ''
            ) }}
          VITE_311_SSO_AUTHORITY_DOMAIN: |-
            ${{ case(
              matrix.app.name == 'philly-311' && env.branch == 'prod', secrets.SSO_311_AUTHORITY_DOMAIN_PROD,
              matrix.app.name == 'philly-311' && env.branch == 'test', secrets.SSO_311_AUTHORITY_DOMAIN_TEST,
              matrix.app.name == 'philly-311', secrets.SSO_311_AUTHORITY_DOMAIN_DEV,
              ''
            ) }}
          VITE_311_SSO_REDIRECT_URI: |-
            ${{ case(
              matrix.app.name == 'philly-311' && env.branch == 'prod', secrets.SSO_311_REDIRECT_URI_PROD,
              matrix.app.name == 'philly-311' && env.branch == 'test', secrets.SSO_311_REDIRECT_URI_TEST,
              matrix.app.name == 'philly-311', secrets.SSO_311_REDIRECT_URI_DEV,
              ''
            ) }}
          VITE_311_SSO_API_SCOPE: |-
            ${{ case(
              matrix.app.name == 'philly-311' && env.branch == 'prod', secrets.SSO_311_API_SCOPE_PROD,
              matrix.app.name == 'philly-311' && env.branch == 'test', secrets.SSO_311_API_SCOPE_TEST,
              matrix.app.name == 'philly-311', secrets.SSO_311_API_SCOPE_DEV,
              ''
            ) }}
          VITE_311_API_URL: |-
            ${{ case(
              matrix.app.name == 'philly-311' && env.branch == 'prod', secrets.API_311_URL_PROD,
              matrix.app.name == 'philly-311' && env.branch == 'test', secrets.API_311_URL_TEST,
              matrix.app.name == 'philly-311', secrets.API_311_URL_DEV,
              ''
            ) }}

  smoke-test:
    name: Smoke test ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    # Runs only after every app has shipped; skipped if a ship failed.
    needs: [detect-changes, ship-apps]
    env:
      branch: ${{ (github.ref == 'refs/heads/main' && 'prod') || (github.ref == 'refs/heads/test' && 'test') || 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect-changes.outputs.updated) }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Only apps with an apps/<name>/e2e package have smoke tests (e.g. not
      # philly-311). Everything below is skipped for the rest.
      - name: Check for smoke tests
        id: target
        shell: bash
        env:
          APP: ${{ matrix.app.name }}
        run: |
          if [ -d "apps/$APP/e2e" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No smoke tests for $APP"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/setup@v2
        if: steps.target.outputs.run == 'true'

      - uses: actions/setup-node@v7
        if: steps.target.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm

      # Install only this app's e2e package and what it depends on.
      - name: Install test dependencies
        if: steps.target.outputs.run == 'true'
        shell: bash
        run: pnpm install --frozen-lockfile --filter "@pinboard/${{ matrix.app.name }}-e2e..."

      - name: Install Chromium
        if: steps.target.outputs.run == 'true'
        working-directory: ${{ format('apps/{0}/e2e', matrix.app.name) }}
        shell: bash
        run: pnpm exec playwright install --with-deps chromium

      # TEST_ENV picks the app's test or prod URL (see packages/playwright-config).
      - name: Run smoke tests against ${{ env.branch }}
        if: steps.target.outputs.run == 'true'
        working-directory: ${{ format('apps/{0}/e2e', matrix.app.name) }}
        shell: bash
        env:
          CI: 'true'
          TEST_ENV: ${{ env.branch }}
        run: pnpm test:smoke

      - name: Upload Playwright report
        if: ${{ !cancelled() && steps.target.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.app.name }}-${{ env.branch }}
          path: |
            apps/${{ matrix.app.name }}/e2e/playwright-report
            apps/${{ matrix.app.name }}/e2e/test-results
          if-no-files-found: ignore
          retention-days: 14
