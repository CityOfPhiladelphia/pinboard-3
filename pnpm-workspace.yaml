packages:
  - 'apps/*/cdk'
  - 'apps/*/frontend'
  - 'packages/*'

catalog:
  '@eslint/js': '^10.0.1'
  '@phila/constructs': '^0.11.4'
  # Every @phila/phila-ui-* package depends on an exact @phila/phila-ui-core version,
  # so the whole set moves together: a mixed set resolves two copies of core, and the
  # module-scoped registries inside it (useVisibility) stop seeing each other.
  # Pinned exactly for the same reason - a range could drift one package off the set.
  '@phila/phila-ui-app-footer': '1.2.5-beta.2'
  '@phila/phila-ui-app-header': '2.0.0-beta.3'
  '@phila/phila-ui-bottom-sheet': '0.1.2-beta.2'
  '@phila/phila-ui-breadcrumbs': '0.2.5-beta.2'
  '@phila/phila-ui-button': '2.3.2-beta.2'
  '@phila/phila-ui-callout': '1.1.0-beta.3'
  '@phila/phila-ui-cards': '0.3.0-beta.3'
  '@phila/phila-ui-charts': '0.1.2-beta.3'
  '@phila/phila-ui-checkbox': '1.1.0-beta.2'
  '@phila/phila-ui-core': '3.1.0-beta.2'
  '@phila/phila-ui-date-field': '0.1.2-beta.2'
  '@phila/phila-ui-filter-chip': '1.1.2-beta.3'
  '@phila/phila-ui-filter-panel': '1.0.2-beta.3'
  '@phila/phila-ui-link': '1.1.2-beta.2'
  '@phila/phila-ui-logo': '0.1.5-beta.2'
  '@phila/phila-ui-map-core': '1.3.0-beta.6'
  '@phila/phila-ui-menu': '0.1.3-beta.2'
  '@phila/phila-ui-radio': '1.1.0-beta.2'
  '@phila/phila-ui-search': '1.2.2-beta.2'
  '@phila/phila-ui-switch': '0.0.7-beta.2'
  '@phila/phila-ui-table': '1.0.2-beta.2'
  '@phila/phila-ui-tabs': '2.0.0-beta.2'
  '@phila/phila-ui-tags': '0.1.2-beta.3'
  '@phila/phila-ui-text-field': '1.2.2-beta.2'
  '@phila/phila-ui-tooltip': '0.1.2-beta.2'
  '@vitejs/plugin-vue': '^6.0.8'
  'aws-cdk': '^2.1132.0'
  'aws-cdk-lib': '^2.261.0'
  'cdk-nag': '^2.38.2'
  'constructs': '^10.7.1'
  eslint: '^10.8.1'
  eslint-config-prettier: '^10.1.8'
  eslint-plugin-vue: '^10.10.0'
  globals: '^17.11.0'
  prettier: '^3.9.6'
  'source-map-support': '^0.5.21'
  'ts-node': '^10.9.0'
  typescript: '^6.0.3'
  typescript-eslint: '^8.65.0'
  vite: '^7.3.6'
  'vite-plugin-vue-devtools': '^8.1.5'
  vue: ^3.5.0
  vue-i18n: ^11.0.1
  vue-router: ^5.0.6
  vue-tsc: '^3.3.10'
